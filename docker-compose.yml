services:
  app:
    build: .
    env_file: .env
    ports:
      #APP_PORT: 8006 producción, 8007 desarrollo/test — se define en el .env de cada clon,
      #así conviven en el mismo servidor sin pisarse (mismo patrón que gestorBQ).
      #Bind en 0.0.0.0 (no 127.0.0.1): Caddy corre en otro contenedor y llega vía
      #el bridge de Docker (host.docker.internal / 172.17.0.1), no vía loopback del host.
      - "${APP_PORT:-8006}:8000"
    restart: unless-stopped
