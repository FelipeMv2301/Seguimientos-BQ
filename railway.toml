#Railway detecta el Dockerfile solo — este archivo solo agrega el healthcheck (endpoint ya
#existente, GET /salud) y la política de restart. No afecta el deploy self-hosted (docker-compose
#lo ignora por completo).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/salud"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
